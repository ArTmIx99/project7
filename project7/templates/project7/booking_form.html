<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Створити бронювання — {{ room.title }}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .booking-card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 480px;
            padding: 32px;
        }

        .booking-card h2 {
            font-size: 1.5rem;
            color: #1a1a1a;
            margin-bottom: 24px;
            text-align: center;
            word-wrap: break-word;
        }

        .booking-card h2 span {
            color: #2563eb;
        }

        /* Стилізація полів форми Django (form.as_p) */
        .booking-form p {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
        }

        .booking-form label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 6px;
        }

        .booking-form input,
        .booking-form select,
        .booking-form textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .booking-form input:focus,
        .booking-form select:focus,
        .booking-form textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .booking-form ul.errorlist {
            color: #dc2626;
            list-style: none;
            font-size: 0.85rem;
            margin-top: 4px;
        }

        /* Кнопка відправки */
        .btn-submit {
            width: 100%;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
        }

        /* Посилання для повернення */
        .back-link-wrapper {
            text-align: center;
            margin-top: 20px;
        }

        .back-link {
            color: #6b7280;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #111827;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="booking-card">
        <h2>Бронювання: <span>{{ room.title }}</span></h2>
        
        <form method="post" class="booking-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-submit">Підтвердити бронювання</button>
        </form>
        
        <div class="back-link-wrapper">
            <a href="{% url 'home' %}" class="back-link">← Повернутися до списку кімнат</a>
        </div>
    </div>

</body>
</html>
